name: Withdraw superseded ISS26 TEST2 patch release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/withdraw-test2.yml'

permissions:
  contents: write

jobs:
  withdraw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Nevmerlyk/ISS26-Updates
      TAG: v0.9.5-bosnia-cabo-atlas-test2
      RELEASE_ID: '439718384'
      ASSET_SHA: '4c3b27a7efa46f97401138c7b2490cc08cc693613cdfb82a9ba12150ba7cd330'
    steps:
      - name: Confirm Test Game rollback and preserve Play Game
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/test/latest.json" -q '.content' | base64 -d > /tmp/test.json
          gh api "repos/$REPO/contents/stable/latest.json" -q '.content' | base64 -d > /tmp/stable.json
          python3 - <<'PY'
          import json
          test=json.load(open('/tmp/test.json'))
          stable=json.load(open('/tmp/stable.json'))
          assert test['latest']['version']=='0.9.5-bosnia-cabo-vram-probe1'
          assert test['latest']['patchSha256']=='CA1910F84EDADB1DCCA3177CEA70F550A6DBDD17173ACBFDB9644F9141ED7404'
          assert stable['latest']['version']=='0.9.4'
          print('Rollback and stable guard PASS')
          PY
      - name: Withdraw exact failed TEST2 GitHub prerelease and tag
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > /tmp/release.json
          python3 - <<'PY'
          import json,os
          release=json.load(open('/tmp/release.json'))
          assert release['tag_name']==os.environ['TAG']
          assert release['prerelease'] is True
          assets=release['assets']
          assert len(assets)==1 and assets[0]['name']=='ISS26_0.9.5_Bosnia_CaboVerde_Atlas_TEST2.iss26p'
          assert assets[0].get('digest','').lower()=='sha256:'+os.environ['ASSET_SHA']
          print('Exact TEST2 release identity verified')
          PY
          gh api -X DELETE "repos/$REPO/releases/$RELEASE_ID"
          gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG"
      - name: Confirm withdrawn release is no longer offered
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Withdrawn TEST2 still exists"
            exit 1
          fi
          echo 'TEST2 prerelease withdrawn; stable 0.9.4 and previous Test Game patch retained'
