name: v096 revision data bundle
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-revision-data-bundle.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ISS26-v096-revision-data
          path: |
            data/integration/fm26_nationality_roster_extract_v22.csv
            data/integration/fm26_reserve_candidates_v22.json
            data/integration/eu_v096_registry.json
          if-no-files-found: error
