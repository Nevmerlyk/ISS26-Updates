name: Audit v0.9.3 patch Mode2 sector headers

on:
  push:
    paths:
      - 'tools/audit_patch_sector_headers.py'
      - 'tools/tests/test_audit_patch_sector_headers.py'
      - '.github/workflows/audit-v094-sector-headers.yml'
  pull_request:
    paths:
      - 'tools/audit_patch_sector_headers.py'
      - 'tools/tests/test_audit_patch_sector_headers.py'
      - '.github/workflows/audit-v094-sector-headers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all patch-only forensic unit tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Download verified release asset through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download v0.9.3-preview --repo Nevmerlyk/ISS26-Updates --pattern ISS26_0.9.3_preview.iss26p --dir dist
      - name: Analyze SHA-256 verified published v0.9.3 XOR patch
        run: |
          python tools/audit_patch_sector_headers.py --patch-file dist/ISS26_0.9.3_preview.iss26p --out dist/v093_sector_headers.json
          python - <<'PY'
          import json, pathlib, os
          x=json.loads(pathlib.Path("dist/v093_sector_headers.json").read_text())
          assert x["version"]=="0.9.3-preview"
          assert x["modified_sectors"]==1412, x["modified_sectors"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## v0.9.3 Mode2 patch-header forensics (no game ISO)\n\n")
              for key in ("modified_sectors", "changed_header_sector_count",
                          "form2_flag_flipped_sector_count",
                          "subheader_delta_mismatch_count",
                          "sync_changed_sector_count",
                          "mode_byte_changed_sector_count"):
                  out.write(f"- {key}: **{x[key]}**\n")
              out.write("\nThese XOR observations do not prove correct flag rendering. "
                        "No game content or BIOS was used or uploaded.\n")
          PY
      - name: Upload forensic report (counts and LBAs only)
        uses: actions/upload-artifact@v4
        with:
          name: ISS26-v093-Mode2-Header-Forensics
          path: dist/v093_sector_headers.json
          if-no-files-found: error
          retention-days: 14
