name: ISS26 native PS1 appearance matching
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-native-appearance-match.yml','tools/match_v096_we2002_appearance.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned community reference database
        shell: bash
        run: |
          set -eu
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/zetaprog/Easy-Mcr-Winning-Eleven-2002-PS1/30af1fe59cf96beee3b066f6cdfcb1b6f3df37cc/fifatomcr/bin/Debug/net8.0-windows10.0.17763.0/mydatabase.db' -o /tmp/reference.db
          sha256sum /tmp/reference.db
      - name: Match native appearance presets by identity
        run: python tools/match_v096_we2002_appearance.py --db /tmp/reference.db --out output
      - uses: actions/upload-artifact@v4
        with:
          name: ISS26-v096-native-appearance-candidates-not-patch
          path: output/
          if-no-files-found: error
          retention-days: 14
