name: Package public FM26 save reader for local verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-fmsave-readonly-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public MIT-licensed reader and dependency
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse fmsave==0.14.4
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fmsave-offline-wheelhouse
          path: wheelhouse/
          retention-days: 1
