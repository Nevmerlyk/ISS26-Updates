name: ISS26 appearance local source subset
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-appearance-local-source-subset.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source identity and visual metadata only
        run: |
          set -eu
          mkdir -p output /tmp/db
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/zetaprog/Easy-Mcr-Winning-Eleven-2002-PS1/30af1fe59cf96beee3b066f6cdfcb1b6f3df37cc/fifatomcr/bin/Debug/net8.0-windows10.0.17763.0/mydatabase.db' -o /tmp/db/we.db
          base='https://raw.githubusercontent.com/Radzim/football_data/076dbb1e76413c93582385d8e56f18384dc6bee9'
          for f in players sofifa; do curl -fsSL --retry 2 "$base/$f.csv" -o "/tmp/db/$f.csv"; done
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/ismailoksuz/EAFC26-DataHub/8724af5803a787c9c262eee2ac8f942651b0e4b9/data/players.csv' -o /tmp/db/fc26.csv
          curl -fsSL --retry 1 --max-time 45 'https://playersdb.app/download/csv' -o /tmp/db/konami.csv
          (cd /tmp/db && printf '%s\n' '623f4367a2322d976f73cb5c08f467bf  players.csv' 'bb2cdb140716d86fcb5e8523c39750f5  sofifa.csv' '764f4c62d94cdefa5fc99d41f6bee08f  fc26.csv' | md5sum -c -)
          python - <<'PY'
          import csv,sqlite3
          from pathlib import Path
          c=sqlite3.connect('file:/tmp/db/we.db?mode=ro',uri=True)
          c.execute('PRAGMA trusted_schema=OFF')
          cur=c.execute('SELECT Id,Name,NAMEWE,Birthday,Club,NationalTeam,Nation,Position,Hair,HairColor,HairFace,HairColorFace,SkinColor,Body,Link FROM Players')
          with open('output/we.csv','w',encoding='utf-8',newline='') as f:
              w=csv.writer(f);w.writerow([x[0] for x in cur.description]);w.writerows(cur)
          for src,cols in {
              'players':'playerid gender birthdate hairtypecode hairstylecode haircolorcode facialhairtypecode facialhaircolorcode skintonecode bodytypecode headtypecode headassetid hashighqualityhead height weight',
              'sofifa':'playerid name full_name dob description country_name club_name image body_type height_cm weight_kg',
              'fc26':'player_id short_name long_name dob nationality_name club_name player_url body_type real_face player_face_url height_cm weight_kg',
              'konami':'konamiID playerName fullName birthdate nationalities height weight real_face'
          }.items():
              with open('/tmp/db/'+src+'.csv',encoding='utf-8-sig',newline='') as f,open('output/'+src+'.csv','w',encoding='utf-8',newline='') as g:
                  r=csv.DictReader(f)
                  selected=[k for k in cols.split() if k in r.fieldnames]
                  w=csv.DictWriter(g,fieldnames=selected,extrasaction='ignore')
                  w.writeheader();w.writerows(r)
          PY
          cp data/integration/v096_appearance_identity_manifest.csv output/
      - uses: actions/upload-artifact@v4
        with:
          name: ISS26-appearance-source-metadata-local
          path: output/
          retention-days: 7
