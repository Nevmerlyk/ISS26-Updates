name: Validate ISS26 v0.9.5 Cape Verde GPU atlas probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v095-name-gpu-probe.yml'
      - 'tools/probe_v095_name_gpu_atlas.py'
      - 'tools/tests/test_probe_v095_name_gpu_atlas.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run synthetic graphics and ISO guards (no game assets)
        run: python -m unittest discover -s tools/tests -p 'test_probe_v095_name_gpu_atlas.py' -v
      - name: Check Python syntax
        run: python -m py_compile tools/probe_v095_name_gpu_atlas.py
  windows_probe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build single-file Windows diagnostic
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --onefile --console --clean --name ISS26-CapeVerde-Probe tools/probe_v095_name_gpu_atlas.py
          if (-not (Test-Path "dist/ISS26-CapeVerde-Probe.exe")) { throw "Missing EXE" }
          @'
          @echo off
          cd /d "%~dp0"
          echo ISS26 v0.9.5 Cape Verde - read-only name atlas probe
          echo Uses the CLEAN original EU 12-track game at D:\ISS 26.
          "ISS26-CapeVerde-Probe.exe"
          if errorlevel 1 (
              echo.
              echo PROBE FAILED. Please share this output; game files are untouched.
          ) else (
              echo.
              echo PASS: Report saved to "%USERPROFILE%\ISS26-CapeVerde-probe.json"
          )
          echo.
          pause
          '@ | Set-Content -Path "dist/Run-ISS26-CapeVerde-Probe.cmd" -Encoding Ascii
      - name: Save read-only probe executable
        uses: actions/upload-artifact@v4
        with:
          name: ISS26-v095-CapeVerde-AtlasProbe
          path: |
            dist/ISS26-CapeVerde-Probe.exe
            dist/Run-ISS26-CapeVerde-Probe.cmd
          if-no-files-found: error
          retention-days: 7
