name: Validate Academy v0.9.6 Task Loop contract

on:
  push:
    paths:
      - 'tasks/latest.json'
      - 'research/latest.json'
      - 'tools/Build-ISS26-Academy-v096-TaskLoop-Local.ps1'
      - 'tools/Release-ISS26-Academy-v096-TaskLoop-Local.ps1'
      - 'tools/ISS26-Academy-v096-TaskLoop-OneClick.ps1'
      - '.github/workflows/validate-academy-taskloop-v096.yml'
  pull_request:
    paths:
      - 'tasks/latest.json'
      - 'research/latest.json'
      - 'tools/Build-ISS26-Academy-v096-TaskLoop-Local.ps1'
      - 'tools/Release-ISS26-Academy-v096-TaskLoop-Local.ps1'
      - 'tools/ISS26-Academy-v096-TaskLoop-OneClick.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate typed task feed and research references
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          plan=json.loads(pathlib.Path('tasks/latest.json').read_text())
          research=json.loads(pathlib.Path('research/latest.json').read_text())
          assert plan['schemaVersion']==1 and type(plan['revision']) is int and 1<=plan['revision']<=100000
          assert len(plan['tasks'])<=16 and len({t['id'] for t in plan['tasks']})==len(plan['tasks'])
          allowed={g['id'] for g in research['goals']}
          for t in plan['tasks']:
              assert re.fullmatch(r'(academy|rookie)_[a-z0-9_]{4,56}',t['id'])
              assert type(t['priority']) is int and 1<=t['priority']<=100
              assert 0<len(t['title'])<=120 and len(t.get('feedback',''))<=480
              assert all(ord(c)>=32 and ord(c)!=127 for c in t['title']+t.get('feedback',''))
              if t['agent']=='Academy':
                  assert t['id'].startswith('academy_') and t['kind']=='capture_scene'
                  assert t['researchGoalId'] in allowed and t['researchRevision']==research['revision']
                  assert t.get('navigationProfile','balanced')=='balanced'
              elif t['agent']=='Rookie':
                  assert t['id'].startswith('rookie_') and t['kind']=='navigate_kickoff'
                  assert t.get('researchGoalId','')=='' and t.get('researchRevision',0)==0
                  assert t.get('navigationProfile','balanced') in ('balanced','recovery_focus','confirmed_first')
              else:
                  raise AssertionError('Unknown agent')
          print('PASS: validated task and research cross-references')
          PY
      - name: Verify PowerShell syntax without building or publishing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='tools/Build-ISS26-Academy-v096-TaskLoop-Local.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { throw ($errors | Out-String) }
          $src=Get-Content $file -Raw
          if(!$src.Contains('feature/academy-v096-task-loop') -or
              !$src.Contains('c80d2a35328ff67e5a663c3653ba38235fefc530') -or
              !$src.Contains('dotnet run') -or $src.Contains('gh release create')) {
              throw 'Build must be pinned, tested, and not publish'
          }
          Write-Host 'PASS: pinned build-only script'

      - name: Parse and verify release tooling without publication
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@(
            'tools/Release-ISS26-Academy-v096-TaskLoop-Local.ps1',
            'tools/ISS26-Academy-v096-TaskLoop-OneClick.ps1'
          )
          foreach($file in $paths) {
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count -gt 0) { throw ($errors | Out-String) }
            $src=Get-Content $file -Raw
            if(!$src.Contains('c80d2a35328ff67e5a663c3653ba38235fefc530')) {
              throw "Wrong source pin: $file"
            }
          }
          $publisher=Get-Content $paths[0] -Raw
          if(!$publisher.Contains('launcher-v0.9.6-taskloop') -or
             !$publisher.Contains('0.9.6.2') -or
             !$publisher.Contains('stable/latest.json') -or
             !$publisher.Contains('git add -- launcher/latest.json') -or
             !$publisher.Contains('Remote ZIP differs')) {
            throw 'Missing release gate'
          }
          Write-Host 'PASS: publisher syntax, pinned source, channel safety'
