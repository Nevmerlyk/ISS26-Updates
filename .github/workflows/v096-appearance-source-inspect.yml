name: ISS26 external appearance source inspection
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-appearance-source-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pinned public football dataset schema
        shell: bash
        run: |
          set -eu
          mkdir /tmp/fc25
          cd /tmp/fc25
          base='https://raw.githubusercontent.com/Radzim/football_data/076dbb1e76413c93582385d8e56f18384dc6bee9'
          for f in players sofifa countries; do curl -fsSL --retry 2 "$base/$f.csv" -o "$f.csv"; done
          printf '%s\n' '623f4367a2322d976f73cb5c08f467bf  players.csv' 'bb2cdb140716d86fcb5e8523c39750f5  sofifa.csv' '9828e4388cc5ec368612fdfef9c8a80d  countries.csv' | md5sum -c -
          python - <<'PY'
          import csv,json
          for name in ('players','sofifa','countries'):
              with open(name+'.csv',encoding='utf-8-sig') as f:
                  r=csv.DictReader(f); rows=list(r)
                  print('SCHEMA',name,len(rows),json.dumps(r.fieldnames,ensure_ascii=False))
                  for x in rows[:2]: print('SAMPLE',name,json.dumps(x,ensure_ascii=False))
          PY
