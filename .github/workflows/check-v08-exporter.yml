name: Check v0.8 XOR-sector exporter

on:
  push:
    paths:
      - 'tools/export_v08_track01.py'
      - '.github/workflows/check-v08-exporter.yml'
  pull_request:
    paths:
      - 'tools/export_v08_track01.py'
      - '.github/workflows/check-v08-exporter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile tools/export_v08_track01.py
      - name: Check sector encoding compatibility with launcher
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, importlib.util, pathlib, struct, tempfile
          spec = importlib.util.spec_from_file_location('export_v08', 'tools/export_v08_track01.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert mod.MAGIC == b'ISS26X01'
          clean = bytes(range(256)) * (mod.SECTOR // 256) + bytes(range(mod.SECTOR % 256))
          assert len(clean) == mod.SECTOR
          changed = bytes([0xA5]) * mod.SECTOR
          with tempfile.TemporaryDirectory() as td:
              d = pathlib.Path(td)
              source = d/'base.bin'
              target = d/'modified.bin'
              patch = d/'patch.iss26p'
              source.write_bytes(clean * 4)
              target.write_bytes(clean * 2 + changed + clean)
              xor = bytes(a ^ b for a, b in zip(clean, changed))
              patch.write_bytes(mod.MAGIC + struct.pack('<I', 1) + struct.pack('<I', 2) +
                                hashlib.sha256(clean).digest() + xor)
              mod.verify_records(source, target, patch, 1)
              assert len(patch.read_bytes()) == 12 + 4 + 32 + mod.SECTOR
              bad = bytearray(patch.read_bytes())
              bad[-1] ^= 0xFF
              patch.write_bytes(bad)
              try:
                  mod.verify_records(source, target, patch, 1)
              except ValueError:
                  pass
              else:
                  raise AssertionError('Corruption must be rejected')
          print('PASS: ISS26X01 sector encoding, SHA256 guards and corruption detection')
          PY
