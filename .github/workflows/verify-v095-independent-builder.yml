name: Verify ISS26 v0.9.5 Independent Flags-Only Builder
on:
  push:
    branches: [feature/v095-national-flags-only]
    paths:
      - 'staging/v0.9.5/builder/**'
      - 'staging/v0.9.5/flags_source/**'
      - '.github/workflows/verify-v095-independent-builder.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 0.9.5 independent builder uses only local inputs and does not publish game
        shell: pwsh
        run: |
          python -m compileall -q staging/v0.9.5/builder staging/v0.9.5/flags_source
          if ($LASTEXITCODE -ne 0) { throw 'Python builder compile error' }
          python -m unittest discover -s staging/v0.9.5/builder -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Independent builder synthetic ISO/EDC/ECC tests failed' }
          python staging/v0.9.5/builder/build_v095.py --help
          if ($LASTEXITCODE -ne 0) { throw 'Independent builder CLI failed' }
          $src=Get-Content staging/v0.9.5/builder/build_v095.py -Raw
          if ($src -match 'gh release create|stable/latest.json' -or
              $src -notmatch 'BASE_RESULT_SHA' -or
              $src -notmatch 'TARGET_COUNTRIES') {
            throw 'Builder unexpected stable publication or missing validation'
          }
      - name: Install Pillow and verify all 17 national flag art generators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          python -m unittest discover -s staging/v0.9.5/flags_source -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Legacy sprite and WE codec regression failed' }
      - name: Confirm stable game remains 0.9.4
        shell: pwsh
        run: |
          $feed=Invoke-RestMethod 'https://raw.githubusercontent.com/Nevmerlyk/ISS26-Updates/main/stable/latest.json'
          if ($feed.latest.version -ne '0.9.4') {
            throw 'The stable game must remain v0.9.4 pending actual gameplay QA'
          }
          Write-Host 'PASS: Independent v0.9.5 builder only, stable v0.9.4 intact'
