name: Publish validated v0.8 game update

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v08-preview
  cancel-in-progress: false

jobs:
  verify-and-activate:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.8.0-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download the published binary asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.8.0-preview --repo Nevmerlyk/ISS26-Updates \
            --pattern 'ISS26_0.8.0_preview.iss26p' --dir /tmp/iss26-v08
          ls -lh /tmp/iss26-v08/

      - name: Verify SHA-256, ISS26X01 structure, all sector records and anonymous download
        shell: python
        run: |
          import hashlib, json, pathlib, re, struct, urllib.request

          candidate = json.loads(pathlib.Path("releases/v0.8.0-preview-candidate.json").read_text())
          assert candidate["schemaVersion"] == 1
          release = candidate["latest"]
          assert release["version"] == "0.8.0-preview"
          assert release["patchUrl"] == (
            "https://github.com/Nevmerlyk/ISS26-Updates/releases/download/"
            "v0.8.0-preview/ISS26_0.8.0_preview.iss26p"
          )
          assert release["baseSha256"] == (
            "D9B483BDEA7774346DF437FEBF038E68CB2C4AD9932A7AD993D3C2B1F620EA44"
          )
          for key in ("patchSha256", "baseSha256", "resultSha256"):
              assert re.fullmatch("[0-9A-F]{64}", release[key]), key
          path = pathlib.Path("/tmp/iss26-v08/ISS26_0.8.0_preview.iss26p")
          patch = path.read_bytes()
          assert len(patch) == 64488, ("Unexpected v0.8 patch size", len(patch))
          assert hashlib.sha256(patch).hexdigest().upper() == release["patchSha256"], (
            "Binary SHA-256 does not match the exported candidate. Feed NOT updated."
          )
          assert patch[:8] == b"ISS26X01"
          count = struct.unpack_from("<I", patch, 8)[0]
          assert count == 27, ("Expected 27 modified sectors", count)
          assert len(patch) == 12 + count * (4 + 32 + 2352)
          last = -1
          for record in range(count):
              position = 12 + record * 2388
              index = struct.unpack_from("<I", patch, position)[0]
              original_sector_hash = patch[position + 4:position + 36]
              xor_delta = patch[position + 36:position + 2388]
              assert 0 <= index < 210951 and index > last, ("Bad sector index", index)
              assert len(original_sector_hash) == 32
              assert len(xor_delta) == 2352 and any(xor_delta)
              last = index
          print("PASS: SHA-256 and 27 ordered unique ISS26X01 XOR-sector records")

          # Verify the Windows app can obtain the asset without GitHub auth.
          request = urllib.request.Request(
              release["patchUrl"], headers={"User-Agent":"ISS26-Update-Validator"}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              anonymous_data = response.read(32 * 1024 * 1024 + 1)
          assert anonymous_data == patch, "Unauthenticated URL is invalid/different"
          print("PASS: public download is identical and accessible anonymously")

      - name: Activate feed only after all verification succeeds
        shell: bash
        run: |
          set -euo pipefail
          cp releases/v0.8.0-preview-candidate.json latest.json
          if git diff --quiet -- latest.json; then
            echo "Feed already matches validated v0.8; no commit needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.json
            git commit -m "Activate independently verifiable ISS26 v0.8.0-preview game patch"
            git push origin HEAD:main
          fi
