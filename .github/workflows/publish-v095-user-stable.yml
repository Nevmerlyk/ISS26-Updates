name: Publish user-designated ISS26 game v0.9.5 stable (known flag defects)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v095-user-stable.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iss26-v095-user-stable
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Nevmerlyk/ISS26-Updates
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned independent v0.9.4 base patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v0.9.4-preview -R "$REPO" --pattern ISS26_0.9.4_preview.iss26p --dir dist
          echo '70E46566A7F2C3A7E5F1E930210A132D452EF0B752D18E92F4B5475DE2CB45FE  dist/ISS26_0.9.4_preview.iss26p' | sha256sum -c -
      - name: Build independent clean-original v0.9.5 from CLUT boundary repairs
        run: |
          PYTHONPATH=tools python tools/build_v095_palette_candidate.py --base dist/ISS26_0.9.4_preview.iss26p --output dist/ISS26_0.9.5.iss26p
          echo 'CA1910F84EDADB1DCCA3177CEA70F550A6DBDD17173ACBFDB9644F9141ED7404  dist/ISS26_0.9.5.iss26p' | sha256sum -c -
          python - <<'PY'
          import pathlib,struct,hashlib
          d=pathlib.Path('dist/ISS26_0.9.5.iss26p').read_bytes()
          assert d[:8]==b'ISS26X01'
          assert struct.unpack_from('<I',d,8)[0]==1412
          assert len(d)==3_371_868
          print('Confirmed standalone base-relative XOR patch, 1412 sectors')
          PY
      - name: Run patch tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Publish v0.9.5 release with visible known-defect disclosure
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/RELEASE_NOTES.md <<'NOTES'
          # ISS26 v0.9.5 — user-designated stable baseline
          
          Owner has explicitly designated this version **stable** for the ISS26 Play Game channel.
          
          This patch is independently applicable to the clean original European ISS Pro Evolution 2 Track 01 (base SHA-256 D9B483BDEA7774346DF437FEBF038E68CB2C4AD9932A7AD993D3C2B1F620EA44).
          It retains v0.9.4 fixes to resource pointers, names and graphic styles; v0.9.5 additionally restores 16 overwritten PS1 palette-zero/transparency entries.
          
          **Known unresolved issues:** Bosnia can display a black flag; some national flags (including Algeria, DR Congo and other new slots) have incorrect artwork, and several sprite/style combinations require PS1 runtime validation. World map highlighting is not changed. This build is not evidence that every flag is correct. The owner has accepted this limitation for the stable designation.
          
          Patch SHA-256: CA1910F84EDADB1DCCA3177CEA70F550A6DBDD17173ACBFDB9644F9141ED7404.
          Derived Track 01 SHA-256: 26EC92C768CA0C41795E0B91F7554ADD1E6D2258E03216FCEF23CD2B8F93BA5A.
          
          No commercial game, CD music, BIOS or save files are distributed.
          NOTES
          if gh release view v0.9.5 -R "$REPO" >/dev/null 2>&1; then
            existing=$(gh api "repos/$REPO/releases/tags/v0.9.5" --jq '[.assets[] | select(.name=="ISS26_0.9.5.iss26p")][0].digest // ""')
            if [[ -n "$existing" && "$existing" != "sha256:ca1910f84edadb1dcca3177cea70f550a6dbdd17173acbfdb9644f9141ed7404" ]]; then
              echo 'ERROR: existing release has conflicting patch digest; refuse overwrite' >&2
              exit 1
            fi
            if [[ -z "$existing" ]]; then
              gh release upload v0.9.5 dist/ISS26_0.9.5.iss26p -R "$REPO"
            fi
            gh release edit v0.9.5 -R "$REPO" --notes-file dist/RELEASE_NOTES.md
          else
            gh release create v0.9.5 dist/ISS26_0.9.5.iss26p -R "$REPO" --target main --title 'ISS26 v0.9.5 — Stable (known flag defects)' --notes-file dist/RELEASE_NOTES.md --latest
          fi
      - name: Verify GitHub release asset THEN activate stable-only game feed
        shell: python
        run: |
          import base64,hashlib,json,subprocess,pathlib
          repo='Nevmerlyk/ISS26-Updates'
          patch=pathlib.Path('dist/ISS26_0.9.5.iss26p').read_bytes()
          expected='CA1910F84EDADB1DCCA3177CEA70F550A6DBDD17173ACBFDB9644F9141ED7404'
          rel=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v0.9.5'],text=True))
          assets=[x for x in rel['assets'] if x['name']=='ISS26_0.9.5.iss26p']
          assert len(assets)==1
          assert assets[0]['size']==len(patch)
          assert assets[0]['digest'].lower()=='sha256:'+expected.lower()
          remote=subprocess.check_output(['gh','api',f'repos/{repo}/releases/assets/{assets[0]["id"]}','-H','Accept: application/octet-stream'])
          assert hashlib.sha256(remote).hexdigest().upper()==expected
          url=f'https://github.com/{repo}/releases/download/v0.9.5/ISS26_0.9.5.iss26p'
          endpoint=f'repos/{repo}/contents/stable/latest.json'
          current=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
          old=json.loads(base64.b64decode(current['content']))
          assert old['latest'] is not None and old['latest']['version'] in ('0.9.4','0.9.5'), 'unexpected stable feed; abort'
          feed={'schemaVersion':1,'channel':'stable','latest':{
            'version':'0.9.5',
            'patchUrl':url,
            'patchSha256':expected,
            'baseSha256':'D9B483BDEA7774346DF437FEBF038E68CB2C4AD9932A7AD993D3C2B1F620EA44',
            'resultSha256':'26EC92C768CA0C41795E0B91F7554ADD1E6D2258E03216FCEF23CD2B8F93BA5A'
          },'notes':'Owner-designated stable v0.9.5. Known flag artwork defects remain; palette transparency repaired. Map unchanged.'}
          payload={'message':'release(stable): owner-designated ISS26 v0.9.5 after SHA256 asset verification','content':base64.b64encode((json.dumps(feed,indent=2)+'\n').encode()).decode(),'sha':current['sha']}
          subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],input=json.dumps(payload),text=True,check=True)
          print('Stable v0.9.5 feed activated; owner-designated, known artwork defects disclosed')
