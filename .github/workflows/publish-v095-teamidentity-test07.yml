name: Publish ISS26 Team Identity Bosnia Stadium GDC Test Game patch 07
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v095-teamidentity-test07.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_test_patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch independently applicable Test06 patch as verified baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          gh release download v0.9.6-teamidentity-test06 --repo Nevmerlyk/ISS26-Updates --pattern 'ISS26_0.9.5_TeamIdentity_Stage5_TEST06.iss26p' --dir work
          echo '3a2b98ecfdaa693f8c652543f9a7122d6095ec488c757268d67970688714a636  work/ISS26_0.9.5_TeamIdentity_Stage5_TEST06.iss26p' | sha256sum -c -
      - name: Merge verified 63-sector stadium Bosnia graphics delta and assert exact SHA-256
        shell: python
        run: |
          from pathlib import Path
          import base64, zlib, struct, hashlib
          src = Path('work/ISS26_0.9.5_TeamIdentity_Stage5_TEST06.iss26p').read_bytes()
          base = bytearray(src)
          assert base[:8] == b'ISS26X01' and len(base) == 3371868
          n, = struct.unpack_from('<I', base, 8)
          assert n == 1412
          records = {}
          for i in range(n):
              at = 12 + i * 2388
              lba, = struct.unpack_from('<I', base, at)
              assert lba not in records
              records[lba] = at + 36
          encoded = Path('staging/v0.9.5/test07_test06_to_stage7_delta.zlib.b64').read_text()
          delta = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(delta).hexdigest().upper() == '9B4698298208DED3D2A9B42697F3A13EAFC5E0750A9D47B173BC76D973F0B252'
          assert delta[:8] == b'ISS26D01'
          count, = struct.unpack_from('<I', delta, 8)
          assert count == 63 and len(delta) == 12 + count * 2356
          changed = []
          for i in range(count):
              at = 12 + i * 2356
              lba, = struct.unpack_from('<I', delta, at)
              assert lba in records and lba not in changed
              changed.append(lba)
              ptr = records[lba]
              for j in range(2352):
                  base[ptr + j] ^= delta[at + 4 + j]
          assert changed == [10914,10915,11087,11088,11263,11264,11435,11436,11599,11600,11769,11770,11937,11938,12111,12112,12288,12289,12465,12466,12619,12620,12789,12790,12950,13123,13296,13472,13645,13646,13812,13813,13973,13974,14145,14146,14309,14310,14479,14480,14669,14670,14839,14840,15002,15003,15170,15171,15346,15347,15520,15521,15677,15678,15847,15848,16020,16193,16194,16356,16357,16548,16549]
          digest = hashlib.sha256(base).hexdigest().upper()
          expected = 'DA022A8CAFCFFC30C3FDF430A4BE80263A17FD3214028E5D939E39AF711D82C9'
          assert digest == expected, (digest, expected)
          dest = Path('work/ISS26_0.9.5_TeamIdentity_Stage7_TEST07.iss26p')
          dest.write_bytes(base)
          print('Verified patch', dest, len(base), digest)
      - name: Publish pre-release asset for launcher Test Game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v0.9.6-teamidentity-test07'
          file='work/ISS26_0.9.5_TeamIdentity_Stage7_TEST07.iss26p'
          if gh release view "$tag" --repo Nevmerlyk/ISS26-Updates >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --repo Nevmerlyk/ISS26-Updates --clobber
          else
            gh release create "$tag" "$file" --repo Nevmerlyk/ISS26-Updates --title 'ISS26 v0.9.5 Bosnia all-stadium GDC flag experimental Test 07' --notes 'EXPERIMENTAL Test Game Test07. FULL standalone 1412-sector ISS26X01 patch for CLEAN original European Track01. Preserves Test06: 16 small flags including Canada, 330 renamed player records in 15 new teams, 44 title-cased Ukraine/Cabo Verde players, Qatar SELECT3, Bosnia dedicated style10 DATSEL/DATSEL3 art. NEW Stage7: repaired all 34 stadium GDC compressed GPU streams using VERIFIED MIPS load base 0x800C8000 and their exact WE source boundaries. Replaced only Bosnia 64x28 tile in each 8192-byte stream; 33 streams re-encoded 1914 to 1708 bytes and one 2370 to 2104 bytes; 63 patch sectors differ from Test06; pointers, all other texels and graphics unchanged. Checked EDC/ECC, all source SHA guard hashes, full reconstructed ISO SHA and 48 unit tests. LIMITATIONS: must verify in PCSX-Redux. Pre-match Russia text and 24x8 scoreboard flags not yet corrected, visual CLUT still unconfirmed, player attributes not remapped. NEVER update stable Play Game.' --prerelease
          fi
          gh release view "$tag" --repo Nevmerlyk/ISS26-Updates --json assets --jq '.assets[] | [.name, .size] | @tsv'
