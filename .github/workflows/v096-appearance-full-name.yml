name: ISS26 appearance full-name refinement
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-appearance-full-name.yml','tools/resolve_v096_appearance_full_names.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve expanded source plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43936401342 --name ISS26-v096-expanded-appearance-candidates-not-patch --dir /tmp/native
      - name: Resolve full name and abbreviated aliases
        run: |
          set -eu
          mkdir /tmp/appearance
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/Radzim/football_data/076dbb1e76413c93582385d8e56f18384dc6bee9/sofifa.csv' -o /tmp/appearance/sofifa.csv
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/ismailoksuz/EAFC26-DataHub/8724af5803a787c9c262eee2ac8f942651b0e4b9/data/players.csv' -o /tmp/appearance/fc26.csv
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/zetaprog/Easy-Mcr-Winning-Eleven-2002-PS1/30af1fe59cf96beee3b066f6cdfcb1b6f3df37cc/fifatomcr/bin/Debug/net8.0-windows10.0.17763.0/mydatabase.db' -o /tmp/reference.db
          (cd /tmp/appearance && printf '%s\n' 'bb2cdb140716d86fcb5e8523c39750f5  sofifa.csv' '764f4c62d94cdefa5fc99d41f6bee08f  fc26.csv' | md5sum -c -)
          python tools/resolve_v096_appearance_full_names.py --src /tmp/appearance --native /tmp/native/we2002_native_appearance_matches.csv --plan /tmp/native/bulk_appearance_candidate_plan.json --db /tmp/reference.db --out output
      - uses: actions/upload-artifact@v4
        with:
          name: ISS26-v096-full-name-appearance-plan-not-patch
          path: output/
          if-no-files-found: error
          retention-days: 30
