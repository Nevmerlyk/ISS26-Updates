name: Prepare v0.8 release for asset upload

on:
  push:
    paths:
      - '.github/workflows/prepare-v08-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or retain a draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.8.0-preview --repo Nevmerlyk/ISS26-Updates >/dev/null 2>&1; then
            echo "Draft/published release already exists."
          else
            gh release create v0.8.0-preview \
              --repo Nevmerlyk/ISS26-Updates \
              --title "ISS26 v0.8.0 Preview — experimental game data" \
              --notes-file releases/v0.8.0-preview-notes.md \
              --prerelease \
              --draft
            echo "Draft release created. Attach the exact .iss26p file and click Publish."
          fi
