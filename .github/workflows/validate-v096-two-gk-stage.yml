name: Validate ISS26 v0.9.6 v22 two-GK source stage
on:
  push:
    branches:
      - feature/v096-game-v22-two-gk-shakhtar-lock
    paths:
      - 'data/integration/ISS26_active_rosters_v22_two_GK_*.csv'
      - 'data/integration/ISS26_active_rosters_v22_two_GK_*.json'
      - 'tools/verify_v096_two_gk_stage.py'
      - 'tests/test_v096_two_gk_stage.py'
      - 'data/integration/ISS26_active_rosters_v23_shakhtar_refresh.csv'
      - 'data/integration/ISS26_shakhtar_v23_five_official_refresh.json'
      - 'data/integration/ISS26_shakhtar_2026_27_official_review_targets.json'
      - 'tools/verify_v096_v23_shakhtar_refresh.py'
      - 'tests/test_v096_v23_shakhtar_refresh.py'
      - 'data/integration/ISS26_active_rosters_v24_shakhtar_current.csv'
      - 'data/integration/ISS26_shakhtar_v24_current_numbers_and_citizenship_targets.json'
      - 'tools/verify_v096_v24_shakhtar_current.py'
      - 'tests/test_v096_v24_shakhtar_current.py'
      - '.github/workflows/validate-v096-two-gk-stage.yml'
  pull_request:
    paths:
      - 'data/integration/ISS26_active_rosters_v22_two_GK_*.csv'
      - 'data/integration/ISS26_active_rosters_v22_two_GK_*.json'
      - 'tools/verify_v096_two_gk_stage.py'
      - 'tests/test_v096_two_gk_stage.py'
      - 'data/integration/ISS26_active_rosters_v23_shakhtar_refresh.csv'
      - 'data/integration/ISS26_shakhtar_v23_five_official_refresh.json'
      - 'data/integration/ISS26_shakhtar_2026_27_official_review_targets.json'
      - 'tools/verify_v096_v23_shakhtar_refresh.py'
      - 'tests/test_v096_v23_shakhtar_refresh.py'
      - 'data/integration/ISS26_active_rosters_v24_shakhtar_current.csv'
      - 'data/integration/ISS26_shakhtar_v24_current_numbers_and_citizenship_targets.json'
      - 'tools/verify_v096_v24_shakhtar_current.py'
      - 'tests/test_v096_v24_shakhtar_current.py'
      - '.github/workflows/validate-v096-two-gk-stage.yml'
permissions:
  contents: read
jobs:
  audit-source-v22:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate actual 1716 source rows and Shakhtar slot22
        run: python tools/verify_v096_two_gk_stage.py
      - name: Run fail-closed regression tests
        run: python -m unittest discover -s tests -p 'test_v096_two_gk_stage.py' -v
      - name: Independently audit all 1716 v23 rows and five Shakhtar replacements
        run: python tools/verify_v096_v23_shakhtar_refresh.py
      - name: Check v23 Shakhtar regression tests
        run: python -m unittest discover -s tests -p 'test_v096_v23_shakhtar_refresh.py' -v
      - name: Verify 2026 Shakhtar current source stage v24
        run: python tools/verify_v096_v24_shakhtar_current.py
      - name: Run v24 source regression suite
        run: python -m unittest discover -s tests -p 'test_v096_v24_shakhtar_current.py' -v
