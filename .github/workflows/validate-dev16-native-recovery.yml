name: Validate ISS26 0.9.6 DEV16 native recovery (source only)
on:
  push:
    branches: [research/dev16-native-module-validation]
    paths: ['.github/workflows/validate-dev16-native-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pinned private DEV16 source (no game data)
        uses: actions/checkout@v4
        with:
          repository: Nevmerlyk/ISS26-Android
          ref: 97cfd5c21333960d1606e72a3cfd0967b276f895
          token: ${{ secrets.ISS26_PUBLIC_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native 12-byte player record regression tests
        run: python -m unittest discover -s tools/ps1_graphics -p 'test_verify_dev16_player_record.py' -v
      - name: Native 24 club and crosspool regression tests
        run: python -m unittest discover -s tools/ps1_graphics -p 'test_audit_dev16_club_source.py' -v
      - name: Seven-frame resident module recovery and fail-closed diff tests
        run: python -m unittest discover -s tools/ps1_graphics -p 'test_recover_dev16_resident_modules.py' -v
      - name: Exact XOR carrier structural, SHA replay and XA Form1/Form2 forensic tests
        run: python -m unittest discover -s tools/ps1_graphics -p 'test_audit_iss26x01_carrier.py' -v
      - name: Compile source only
        run: python -m py_compile tools/ps1_graphics/recover_dev16_resident_modules.py tools/ps1_graphics/audit_dev16_club_source.py tools/ps1_graphics/verify_dev16_player_record.py tools/ps1_graphics/audit_iss26x01_carrier.py tools/ps1_graphics/test_audit_iss26x01_carrier.py
      - name: Assert game update manifests are not touched
        run: |
          echo 'Research-only CI: 0.9.5 Stable/Test and Academy launcher channels unchanged'
          echo 'No test game image or original ROM uploaded or published'
