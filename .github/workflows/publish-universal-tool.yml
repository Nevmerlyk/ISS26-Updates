name: Publish ISS26 Universal Tool independent update channel

on:
  push:
    branches: [main]
    paths:
      - 'universal-tool/staging/ready.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iss26-universal-tool-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify app-only archive
        shell: python
        run: |
          import base64,hashlib,io,json,pathlib,zipfile
          root=pathlib.Path('universal-tool/staging')
          m=json.loads((root/'ready.json').read_text())
          assert m['product']=='ISS26-Universal-Tool'
          assert m['version']=='1.2.0'
          parts=sorted(root.glob('part_*.b64'))
          assert len(parts)==m['partCount'],f'incomplete payload {len(parts)}/{m["partCount"]}'
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert len(raw)==m['sizeBytes']
          assert hashlib.sha256(raw).hexdigest().upper()==m['sha256']
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              paths=z.namelist()
              assert paths and all(p.startswith('app/') and '..' not in p.split('/') for p in paths)
              assert 'app/universal_gui.py' in paths and 'app/healthcheck.py' in paths
          pathlib.Path('dist').mkdir(exist_ok=True)
          out=pathlib.Path('dist/ISS26_Universal_Tool_update_1.2.0.zip')
          out.write_bytes(raw)
          print('Verified',out,len(raw),'bytes, SHA-256',m['sha256'])
      - name: Publish standalone Universal Tool release (never game patch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view universal-tool-v1.2.0 --repo Nevmerlyk/ISS26-Updates >/dev/null 2>&1; then
            gh release upload universal-tool-v1.2.0 dist/ISS26_Universal_Tool_update_1.2.0.zip --repo Nevmerlyk/ISS26-Updates --clobber
          else
            gh release create universal-tool-v1.2.0 dist/ISS26_Universal_Tool_update_1.2.0.zip --repo Nevmerlyk/ISS26-Updates --target main --title 'ISS26 Universal Tool v1.2.0' --notes 'App-only safe updates. Does not modify original BIN/CUE or game auto-update feed.'
          fi
      - name: Verify public release and activate separate tool feed LAST
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,hashlib,json,pathlib,subprocess,urllib.request
          repo='Nevmerlyk/ISS26-Updates'
          m=json.loads(pathlib.Path('universal-tool/staging/ready.json').read_text())
          assets=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/universal-tool-v1.2.0'],text=True))['assets']
          selected=[x for x in assets if x['name']=='ISS26_Universal_Tool_update_1.2.0.zip' and x['size']==m['sizeBytes']]
          assert len(selected)==1,'missing published asset or invalid size'
          url=selected[0]['browser_download_url']
          assert url=='https://github.com/Nevmerlyk/ISS26-Updates/releases/download/universal-tool-v1.2.0/ISS26_Universal_Tool_update_1.2.0.zip'
          response=subprocess.check_output(['gh','api',f'repos/{repo}/releases/assets/{selected[0]["id"]}','-H','Accept: application/octet-stream'])
          assert hashlib.sha256(response).hexdigest().upper()==m['sha256']
          feed={'schemaVersion':1,'product':'ISS26-Universal-Tool','version':'1.2.0','archiveUrl':url,'sha256':m['sha256'],'notes':'Graphics CLUT galleries and auto-detected clean original BIN/CUE'}
          endpoint=f'repos/{repo}/contents/universal-tool/latest.json'
          payload={'message':'release: activate separate ISS26 Universal Tool v1.2.0 self-update feed','content':base64.b64encode((json.dumps(feed,indent=2)+'\n').encode()).decode()}
          try:
              obj=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              payload['sha']=obj['sha']
          except subprocess.CalledProcessError:pass
          subprocess.run(['gh','api','-X','PUT',endpoint,'--input','-'],input=json.dumps(payload),text=True,check=True)
          print('Separate Universal Tool feed activated without changing game latest.json')
