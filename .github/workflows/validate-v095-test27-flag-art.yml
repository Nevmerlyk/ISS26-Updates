name: Test27 - PS1 national flag 4bpp artwork research (no game patch)

on:
  push:
    branches: [feature/v095-test27-flag-artwork, feature/v095-test27-ram-stage-profiles, feature/v095-test27-real-art-visual-evidence, feature/v095-test27-live-flag-replacement, feature/v095-test27-standalone-patch-builder, feature/v095-test27-static-stage-code-audit, fix/test27-real-resource-parser]
    paths:
      - '.github/workflows/validate-v095-test27-flag-art.yml'
      - 'tools/test27_flag_art_4bpp.py'
      - 'tools/test27_gpu_stream_edit.py'
      - 'tools/test27_build_standalone_atlas_candidate.py'
      - 'tools/v095_name_lz_codec.py'
      - 'tools/tests/test_test27_standalone_atlas_candidate.py'
      - 'tools/Build-ISS26-Test27-StandaloneArt.cmd'
      - 'tools/Build-ISS26-Test27-StandaloneArt.ps1'
      - 'diagnostics/v095-test27-standalone-atlas-builder.md'
      - 'tools/test27_live_flag_replacement.py'
      - 'tools/tests/test_test27_live_flag_replacement.py'
      - 'tools/Run-ISS26-Test27-LiveFlagPreview.cmd'
      - 'diagnostics/v095-test27-live-flag-replacement.md'
      - 'tools/test27_stage_writer_guard.py'
      - 'tools/test27_stage_code_audit.py'
      - 'tools/tests/test_test27_stage_code_audit.py'
      - 'tools/test27_extract_real_flag_pixels.py'
      - 'tools/tests/test_test27_flag_art_4bpp.py'
      - 'tools/tests/test_test27_stage_writer_guard.py'
      - 'tools/tests/test_test27_extract_real_flag_pixels.py'
      - 'tools/test27_analyze_stage_writer.py'
      - 'tools/tests/test_test27_analyze_stage_writer.py'
      - 'diagnostics/v095-test27-stage3-source-art-and-staging-plan-20261114.md'
      - 'tools/Build-ISS26-Academy-Test27-MIPS-Preview-Local.ps1'
      - 'tools/Run-ISS26-Test27-RealFlagPreview.ps1'
      - 'tools/Run-ISS26-Test27-RealFlagPreview.cmd'
      - 'diagnostics/v095-test27-ram-transfer-paired-profile-20261114.md'
      - 'tools/test27_validate_owner_flag_report.py'
      - 'tools/tests/test_test27_validate_owner_flag_report.py'
      - 'diagnostics/v095-test27-owner-visual-asset-rejection-20261114.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flag-art-research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all new Test27 Python modules
        run: |
          python -m py_compile tools/test27_flag_art_4bpp.py tools/test27_stage_writer_guard.py tools/test27_extract_real_flag_pixels.py
          python -m py_compile tools/tests/test_test27_flag_art_4bpp.py tools/tests/test_test27_stage_writer_guard.py tools/tests/test_test27_extract_real_flag_pixels.py
          python -m py_compile tools/test27_analyze_stage_writer.py tools/tests/test_test27_analyze_stage_writer.py
          python -m py_compile tools/test27_validate_owner_flag_report.py tools/tests/test_test27_validate_owner_flag_report.py
      - name: Validate PS1 4bpp flags and 12-row-mask regression
        run: python -m unittest discover -s tools/tests -p 'test_test27_flag_art_4bpp.py' -v
      - name: Validate four MIPS wrappers and five original style-map guards
        run: python -m unittest discover -s tools/tests -p 'test_test27_stage_writer_guard.py' -v
      - name: Validate existing owner ZIP pixel/CLUT extractor with synthetic VRAM
        run: python -m unittest discover -s tools/tests -p 'test_test27_extract_real_flag_pixels.py' -v
      - name: Validate MIPS staged 16-row copy anomaly forensic classifier
        run: python -m unittest discover -s tools/tests -p 'test_test27_analyze_stage_writer.py' -v
      - name: Verify owner real-flag JSON evidence and stop unsafe patch promotion
        run: python -m unittest discover -s tools/tests -p 'test_test27_validate_owner_flag_report.py' -v
      - name: Parse and policy-check Test27 private Academy local preview builder
        shell: pwsh
        run: |
          $path = (Resolve-Path 'tools/Build-ISS26-Academy-Test27-MIPS-Preview-Local.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw "Test27 PowerShell syntax errors: $($errors -join '; ')" }
          $src = Get-Content -LiteralPath $path -Raw
          if (-not $src.Contains('92aef5a8d600d02ff68205d80031e122ea8300b2')) {
            throw "Academy preview source pin changed"
          }
          if (-not $src.Contains('previewNotStable = $true')) { throw "Preview-only gate missing" }
          if (-not $src.Contains('test27RamTopBottomPostReturnProfiles = $true')) { throw "Missing RAM profile preview report gate" }
          if ($src -match 'gh release create|Invoke-RestMethod.*PATCH') { throw "Unsafe publish action in local builder" }
          Write-Host 'PASS: syntax and source/preview safety gate'

      - name: Validate standalone Test27 Windows source+CLUT preview runner
        shell: pwsh
        run: |
          $ps1 = 'tools/Run-ISS26-Test27-RealFlagPreview.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $ps1).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Preview PowerShell syntax: $($errors -join '; ')" }
          $src = Get-Content -Raw -LiteralPath $ps1
          $cmd = Get-Content -Raw -LiteralPath 'tools/Run-ISS26-Test27-RealFlagPreview.cmd'
          if (-not $src.Contains('7995a5c263ec8641ab5989af5a686cf37ca5de6d')) {
            throw 'Unverified Test27 extractor source pin'
          }
          if (-not $cmd.Contains('38b69fc4e0b799f0aa23a64a60b4c1d485d3d5d5') -or
              -not $cmd.Contains('7995a5c263ec8641ab5989af5a686cf37ca5de6d')) {
            throw 'Unpinned CMD source helper'
          }
          if ($cmd.Contains('%~dp0Run-ISS26-Test27-RealFlagPreview.ps1')) {
            throw 'CMD must not silently use a stale adjacent PowerShell'
          }
          if (-not $src.Contains('ExpectedArchiveHash') -or
              -not $src.Contains('comparison_sheet_file')) {
            throw 'Input verification and contact sheet report missing'
          }
          Write-Host 'PASS: Windows one-file private ZIP preview source syntax, sha pin, no stale helper'
      - name: Test temporary VRAM replacement transaction and rollback
        run: python -m unittest discover -s tools/tests -p 'test_test27_live_flag_replacement.py' -v
      - name: Verify real source-art editing and independent sector composition on synthetic inputs
        run: python -m unittest discover -s tools/tests -p 'test_test27_standalone_atlas_candidate.py' -v
      - name: Verify static MIPS stage-code context and exact overlay guards
        run: python -m unittest discover -s tools/tests -p 'test_test27_stage_code_audit.py' -v
      - name: Verify local standalone-art builder launch scripts and pinned source
        shell: pwsh
        run: |
          $path = (Resolve-Path 'tools/Build-ISS26-Test27-StandaloneArt.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw "PowerShell parser errors: $($errors -join '; ')" }
          $ps1 = Get-Content -Raw -LiteralPath $path
          $cmd = Get-Content -Raw -LiteralPath 'tools/Build-ISS26-Test27-StandaloneArt.cmd'
          if (-not $ps1.Contains('fabc23fcc601d38450979f70436a778895336867')) { throw 'Unpinned Python sources' }
          if (-not $cmd.Contains('2a8267fcf140e0e2bbe9330cb19808926a051685')) { throw 'Unpinned PowerShell source' }
          if (-not $ps1.Contains('--experimental') -or -not $ps1.Contains('release_authorized')) { throw 'Missing safety gate' }
          if ($ps1 -match 'gh release create|gh release upload|Invoke-RestMethod.*PATCH') { throw 'Unexpected publication operation' }
          Write-Host 'PASS: local-only pinned builder launch syntax and source guards'
      - name: Build isolated 64x28 flag-art research bundle
        run: python tools/test27_flag_art_4bpp.py --output-dir build/Test27_FlagArt
      - name: Inspect art manifest and secure source separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/Test27_FlagArt/test27_manifest.json').read_text())
          assert data['can_install_into_game'] is False
          assert data['source_disc_modified'] is False
          assert data['game_update_feed_modified'] is False
          assert len(data['flags'])==2 and data['tile_bytes']==896
          stable=json.loads(Path('stable/latest.json').read_text())
          test=json.loads(Path('test/latest.json').read_text())
          assert stable['latest']['version']=='0.9.4'
          assert test['latest']['version']=='0.9.5-largeflag-source-test13'
          print('PASS: research flag assets only, feeds unchanged')
          PY
      - name: Upload Test27 candidate art and CLUT for visual review only
        uses: actions/upload-artifact@v4
        with:
          name: ISS26-Test27-FlagArt-Research
          path: build/Test27_FlagArt/
          if-no-files-found: error
          retention-days: 7
