name: ISS26 appearance identity refinement
on:
  push:
    branches: [feature/v096-player-database-integration]
    paths: ['.github/workflows/v096-appearance-refinement.yml','tools/refine_v096_appearance_identities.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve prior validated source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43934305577 --name ISS26-v096-historical-appearance-reference-not-patch --dir /tmp/ea
          gh run download 43934619008 --name ISS26-v096-combined-appearance-plan-not-patch --dir /tmp/native
      - name: Reconcile aliases with independent identity evidence
        run: |
          set -eu
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/zetaprog/Easy-Mcr-Winning-Eleven-2002-PS1/30af1fe59cf96beee3b066f6cdfcb1b6f3df37cc/fifatomcr/bin/Debug/net8.0-windows10.0.17763.0/mydatabase.db' -o /tmp/reference.db
          python tools/refine_v096_appearance_identities.py --db /tmp/reference.db --native /tmp/native/we2002_native_appearance_matches.csv --external /tmp/ea/fc25_appearance_matches.csv --out output
          python tools/merge_v096_appearance_candidates.py --native output/we2002_native_appearance_matches.csv --external /tmp/ea/fc25_appearance_matches.csv --out output
      - uses: actions/upload-artifact@v4
        with:
          name: ISS26-v096-refined-appearance-plan-not-patch
          path: output/
          retention-days: 30
          if-no-files-found: error
