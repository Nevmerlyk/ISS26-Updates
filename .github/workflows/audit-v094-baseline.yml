name: Audit v0.9.3 national flag patch regression

on:
  push:
    paths:
      - 'tools/compare_preview_patches.py'
      - 'tools/tests/test_compare_preview_patches.py'
      - '.github/workflows/audit-v094-baseline.yml'
  pull_request:
    paths:
      - 'tools/compare_preview_patches.py'
      - 'tools/tests/test_compare_preview_patches.py'
      - '.github/workflows/audit-v094-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent XOR comparison logic
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Download and verify public v0.9.2 and v0.9.3 release assets
        run: |
          mkdir -p dist
          python tools/compare_preview_patches.py --out dist/v093_delta_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('dist/v093_delta_audit.json').read_text())
          assert report['left_version']=='0.9.2-preview'
          assert report['right_version']=='0.9.3-preview'
          assert report['changed_sectors_between_releases'] > 0
          assert report['changed_bytes_between_releases'] > 0
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as f:
              f.write('## ISS26 v0.9.3 baseline audit (read-only)\n')
              f.write(f"Compared **{report['left_version']} → {report['right_version']}** "
                      f"without distributing the original BIN.\n\n")
              f.write(f"Changed sectors: **{report['changed_sectors_between_releases']}**; "
                      f"changed bytes: **{report['changed_bytes_between_releases']}**.\n\n")
              f.write('This check does **not** verify actual flag imagery or PS1 rendering. '
                      'It cannot release v0.9.4 automatically.\n')
          PY
      - name: Attach forensic report
        uses: actions/upload-artifact@v4
        with:
          name: ISS26-v093-v092-graphics-diff-audit
          path: dist/v093_delta_audit.json
          if-no-files-found: error
          retention-days: 14
