name: Publish ISS26 Launcher v0.4.0 Portable Mode

on:
  push:
    paths:
      - '.github/workflows/publish-launcher-v040.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iss26-launcher-v040-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ARTIFACT_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-28c8-8210-8c8d-e6169401723a/raw?se=2026-11-07T18%3A38%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=9085d410-05d6-5147-b95e-684e83f2b8fa&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-07T00%3A06%3A45Z&ske=2026-11-08T00%3A06%3A45Z&sks=b&skv=2026-02-06&sig=LqWulaZCIl7bMpLJ0LM9B2qcCAENCf%2BGTFpzTdC58zo%3D'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download actual signed artifact from private Windows CI run
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            --max-time 240 -o /tmp/iss26-windows-artifact.zip "$ARTIFACT_URL"
          mkdir -p /tmp/iss26-ci
          unzip -q /tmp/iss26-windows-artifact.zip -d /tmp/iss26-ci
          test -f /tmp/iss26-ci/ISS26-LauncherUpdate.zip
          test -f /tmp/iss26-ci/candidate-launcher-latest.json
      - name: Validate version and full SHA256 of ZIP + both EXEs
        shell: python
        run: |
          import hashlib, io, json, os, pathlib, zipfile
          p=pathlib.Path('/tmp/iss26-ci')
          manifest=json.loads((p/'candidate-launcher-latest.json').read_text(encoding='utf-8-sig'))
          assert manifest.get('schemaVersion') == 1
          v=manifest['latest']
          assert v['version']=='0.4.0',v['version']
          expected='https://github.com/Nevmerlyk/ISS26-Updates/releases/download/launcher-v0.4.0/ISS26-LauncherUpdate.zip'
          assert v['zipUrl']==expected,v['zipUrl']
          archive=(p/'ISS26-LauncherUpdate.zip').read_bytes()
          assert 0<len(archive)<160*1024*1024
          assert hashlib.sha256(archive).hexdigest().upper()==v['zipSha256'].upper()
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert sorted(z.namelist())==['ISS26.Updater.exe','ISS26.exe']
              for file,key in (('ISS26.exe','launcherSha256'),('ISS26.Updater.exe','updaterSha256')):
                  data=z.read(file)
                  assert data[:2]==b'MZ',(file,'Windows EXE signature')
                  assert len(data)<160*1024*1024
                  assert hashlib.sha256(data).hexdigest().upper()==v[key].upper(),file
          print('PASS: v0.4.0 official workflow artifact, version and all hashes verified')
      - name: Publish public launcher Release asset
        shell: bash
        run: |
          set -euo pipefail
          if gh release view launcher-v0.4.0 --repo Nevmerlyk/ISS26-Updates >/dev/null 2>&1; then
            gh release upload launcher-v0.4.0 /tmp/iss26-ci/ISS26-LauncherUpdate.zip \
              --repo Nevmerlyk/ISS26-Updates --clobber
          else
            gh release create launcher-v0.4.0 /tmp/iss26-ci/ISS26-LauncherUpdate.zip \
              --repo Nevmerlyk/ISS26-Updates --target main \
              --prerelease --title "ISS26 Windows v0.4.0 — Portable Mode" \
              --notes "Automatic self-update of ISS26 Windows v0.3.0: stores generated patches, emulator saves and settings in ISS26_Data beside game. Verified migration from AppData. Does not distribute or modify original PS1 game, its music or BIOS."
          fi
      - name: Verify anonymous download before turning feed on
        shell: python
        run: |
          import hashlib,json,time,urllib.request,pathlib
          p=pathlib.Path('/tmp/iss26-ci')
          release=json.loads((p/'candidate-launcher-latest.json').read_text(encoding='utf-8-sig'))['latest']
          url=release['zipUrl']
          for i in range(8):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'ISS26-Release-Validator'}),timeout=45) as f:
                      raw=f.read()
                  assert hashlib.sha256(raw).hexdigest().upper()==release['zipSha256'].upper()
                  print('PASS: Anonymous public release ZIP downloads and matches SHA256')
                  break
              except Exception as exc:
                  if i==7:raise
                  print('Release CDN not ready yet',exc)
                  time.sleep(7)
      - name: Publish verified portable launcher to the public updater feed
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/iss26-ci/candidate-launcher-latest.json launcher/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launcher/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified ISS26 Windows v0.4.0 portable self-update"
            git push
          fi
          echo "ISS26 launcher v0.4.0 published; existing 0.3.0 clients will auto-upgrade"
