name: Validate v0.9.5 national palette candidate - NOT PUBLISHED

on:
  push:
    paths:
      - 'tools/build_v095_palette_candidate.py'
      - 'tools/tests/test_build_v095_palette_candidate.py'
      - '.github/workflows/validate-v095-palette-candidate.yml'
  pull_request:
    paths:
      - 'tools/build_v095_palette_candidate.py'
      - 'tools/tests/test_build_v095_palette_candidate.py'
      - '.github/workflows/validate-v095-palette-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run patch forensics tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Obtain official v0.9.4 independent patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download v0.9.4-preview --repo Nevmerlyk/ISS26-Updates --pattern ISS26_0.9.4_preview.iss26p --dir dist
      - name: Build SHA256 pinned independent palette test candidate
        run: |
          python tools/build_v095_palette_candidate.py --base dist/ISS26_0.9.4_preview.iss26p --output dist/ISS26_0.9.5_palette_candidate.iss26p
      - name: Inspect candidate without enabling auto-update
        run: |
          python - <<'PY'
          import hashlib, struct
          from pathlib import Path
          data=Path('dist/ISS26_0.9.5_palette_candidate.iss26p').read_bytes()
          assert data[:8]==b'ISS26X01'
          assert struct.unpack_from('<I', data, 8)[0]==1412
          assert len(data)==3371868
          assert hashlib.sha256(data).hexdigest().upper()=='CA1910F84EDADB1DCCA3177CEA70F550A6DBDD17173ACBFDB9644F9141ED7404'
          print('PASS: binary candidate; does NOT certify correct flags on all screens')
          PY
      - name: Save short-lived candidate for validation
        uses: actions/upload-artifact@v4
        with:
          name: ISS26-v095-CLUT-boundary-candidate-NOT-FULL-FLAGS-RELEASE
          path: dist/ISS26_0.9.5_palette_candidate.iss26p
          retention-days: 1
          if-no-files-found: error
